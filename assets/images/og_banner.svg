<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient (Deep Emerald Forest) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051610"/>
      <stop offset="50%" stop-color="#0A2219"/>
      <stop offset="100%" stop-color="#030C08"/>
    </linearGradient>

    <!-- Luxury Roman Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DFAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9F7624"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#051610" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Ornate Luxury Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="42" y="42" width="1116" height="546" rx="10" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>

  <!-- Corner Flourishes -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 1150 80 L 1150 50 L 1120 50" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 50 550 L 50 580 L 80 580" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 1150 550 L 1150 580 L 1120 580" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Central Badge / Crest -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Starburst Accent -->
    <path d="M 0 -35 L 6 -12 L 28 -12 L 10 3 L 17 25 L 0 12 L -17 25 L -10 3 L -28 -12 L -6 -12 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  </g>

  <!-- Main Brand Title -->
  <text x="600" y="275" font-family="'Cinzel', Georgia, serif" font-size="76" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="8" filter="url(#softGlow)">GOD MARKET</text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="335" font-family="'Outfit', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#CBD8D1" text-anchor="middle" letter-spacing="6">FOOD · COFFEE · HEALTHY</text>

  <!-- Divider Line -->
  <line x1="420" y1="365" x2="780" y2="365" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Value Proposition -->
  <text x="600" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="34" font-weight="600" fill="#FAF6F0" text-anchor="middle" letter-spacing="1">
    Cafeterías de Especialidad &amp; Desayunos Gourmet
  </text>

  <!-- Location Badge -->
  <g transform="translate(600, 475)">
    <rect x="-180" y="0" width="360" height="42" rx="21" fill="rgba(212, 175, 55, 0.12)" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FAF6F0" text-anchor="middle" letter-spacing="3">BUENOS AIRES · ENVÍO &amp; RETIRO</text>
  </g>
</svg>
