<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9536F"/>
      <stop offset="100%" stop-color="#C0395B"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Vibrant Background (Appetizing Raspberry Gradient) -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.2"/>

  <!-- Cake Icon Group (Bold & High Contrast for Small Thumbnails) -->
  <g transform="translate(190, 110)" filter="url(#shadow)">
    <!-- Top Cherry/Berry -->
    <circle cx="210" cy="50" r="28" fill="#FF4D6D" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M210 24 Q228 6 242 12" fill="none" stroke="#2B1E1A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Top Cake Tier -->
    <rect x="110" y="80" width="200" height="90" rx="28" fill="url(#cakeGrad)" stroke="#2B1E1A" stroke-width="8"/>
    <!-- Frosting Drips -->
    <path d="M110 115 Q135 140 160 115 Q185 140 210 115 Q235 140 260 115 Q285 140 310 115 L310 80 L110 80 Z" fill="#FFD166"/>

    <!-- Middle Chocolate Tier -->
    <rect x="60" y="180" width="300" height="100" rx="32" fill="#3D231D" stroke="#2B1E1A" stroke-width="8"/>
    <!-- Strawberry Cream Layer -->
    <path d="M60 220 Q100 245 140 220 Q180 245 220 220 Q260 245 300 220 Q330 245 360 220 L360 180 L60 180 Z" fill="#FF758F"/>

    <!-- Bottom Tier -->
    <rect x="20" y="290" width="380" height="110" rx="36" fill="url(#cakeGrad)" stroke="#2B1E1A" stroke-width="8"/>
    <!-- Golden Caramel Ribbon -->
    <rect x="20" y="340" width="380" height="24" fill="url(#gold)"/>

    <!-- Cake Stand Plate -->
    <rect x="0" y="405" width="420" height="24" rx="12" fill="url(#gold)" stroke="#2B1E1A" stroke-width="6"/>
    <path d="M150 429 L130 470 L290 470 L270 429 Z" fill="url(#gold)" stroke="#2B1E1A" stroke-width="6"/>
    <rect x="110" y="470" width="200" height="18" rx="9" fill="url(#gold)" stroke="#2B1E1A" stroke-width="6"/>
  </g>

  <!-- Bold, Extra Clear Typography for WhatsApp Thumbnails -->
  <text x="400" y="665" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DULCE ATELIER</text>
  
  <rect x="210" y="695" width="380" height="42" rx="21" fill="#FFFFFF"/>
  <text x="400" y="724" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#D9536F" text-anchor="middle" letter-spacing="3">PASTELERÍA &amp; DESAYUNOS</text>
</svg>
