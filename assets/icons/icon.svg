<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Studio Botanical Emerald Backdrop (deep tactile luxury, zero flat black) -->
    <linearGradient id="bgStudio" x1="14%" y1="4%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#1E523E"/>
      <stop offset="38%" stop-color="#0E2E22"/>
      <stop offset="76%" stop-color="#081C15"/>
      <stop offset="100%" stop-color="#04100B"/>
    </linearGradient>

    <!-- Soft Emerald Center Spotlight -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="54%">
      <stop offset="0%" stop-color="#2D7459" stop-opacity="0.65"/>
      <stop offset="52%" stop-color="#13382A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#04100B" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Golden Ambient Aura behind Star & Crest -->
    <radialGradient id="goldAura" cx="50%" cy="42%" r="44%">
      <stop offset="0%" stop-color="#F2D078" stop-opacity="0.30"/>
      <stop offset="48%" stop-color="#D4AF37" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Top Gloss Sheen (native iOS/luxury medallion light) -->
    <linearGradient id="topGlass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Brushed Gold Ring Gradient -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7DC"/>
      <stop offset="22%" stop-color="#F1D48A"/>
      <stop offset="50%" stop-color="#C89F3C"/>
      <stop offset="78%" stop-color="#F5DE9B"/>
      <stop offset="100%" stop-color="#9A721E"/>
    </linearGradient>

    <!-- Sculpted Vertical Metallic Gold for GOD Wordmark -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF3"/>
      <stop offset="28%" stop-color="#F9E4A6"/>
      <stop offset="65%" stop-color="#D7AF48"/>
      <stop offset="100%" stop-color="#A67D20"/>
    </linearGradient>

    <!-- Warm Satin Champagne for MARKET & Accents -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D1"/>
      <stop offset="50%" stop-color="#E5C267"/>
      <stop offset="100%" stop-color="#B78C2B"/>
    </linearGradient>

    <!-- Star Radial Glow -->
    <radialGradient id="starBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DE" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#E5C061" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Tactile Drop Shadow so Gold Emblem lifts off Emerald Surface -->
    <filter id="crestShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020A07" flood-opacity="0.68"/>
    </filter>

    <filter id="starShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020A07" flood-opacity="0.55"/>
    </filter>

    <clipPath id="medallionClip">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <!-- Full-Bleed Luxury Botanical Emerald Canvas -->
  <rect width="512" height="512" fill="url(#bgStudio)"/>
  <rect width="512" height="512" fill="url(#emeraldGlow)"/>
  <rect width="512" height="512" fill="url(#goldAura)"/>

  <!-- Inner Subtle Medallion Disc Depth -->
  <circle cx="256" cy="256" r="222" fill="#071B14" fill-opacity="0.48"/>
  <ellipse cx="256" cy="120" rx="206" ry="120" fill="url(#topGlass)" clip-path="url(#medallionClip)"/>

  <!-- ==========================================
       MEDALLION RINGS (Crisp Metallic Bevel)
       ========================================== -->
  <!-- Outer Sculpted Gold Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#ringGold)" stroke-width="4.2"/>
  <!-- Delicate Inner Champagne Hairline -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#F5DFAC" stroke-width="1.35" stroke-dasharray="3,6" opacity="0.65"/>
  <!-- Subtle Inner Glow Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#C89F3C" stroke-width="0.9" opacity="0.38"/>

  <!-- Cardinal Diamond Studs -->
  <g fill="#FFF7DE" filter="url(#starShadow)">
    <polygon points="256,26 263,34 256,42 249,34"/>
    <circle cx="256" cy="34" r="2" fill="#C49A33"/>
    <polygon points="256,470 263,478 256,486 249,478"/>
    <circle cx="256" cy="478" r="2" fill="#C49A33"/>
    <polygon points="26,256 34,263 42,256 34,249"/>
    <circle cx="34" cy="256" r="2" fill="#C49A33"/>
    <polygon points="470,256 478,263 486,256 478,249"/>
    <circle cx="478" cy="256" r="2" fill="#C49A33"/>
  </g>

  <!-- ==========================================
       1. CREST TOP: 8-POINT FACETED CELESTIAL STAR
       ========================================== -->
  <circle cx="256" cy="126" r="76" fill="url(#starBloom)"/>
  <g transform="translate(256, 126)" filter="url(#starShadow)">
    <!-- Primary Cardinal Rays (58px, crisp 3D facets) -->
    <polygon points="0,0 0,-58 10.5,-14.5" fill="#FFFBEB"/>
    <polygon points="0,0 0,-58 -10.5,-14.5" fill="#AF811C"/>
    <polygon points="0,0 0,58 -10.5,14.5" fill="#F5DF9F"/>
    <polygon points="0,0 0,58 10.5,14.5" fill="#825B0F"/>
    <polygon points="0,0 58,0 14.5,10.5" fill="#FAE9B8"/>
    <polygon points="0,0 58,0 14.5,-10.5" fill="#9A7016"/>
    <polygon points="0,0 -58,0 -14.5,-10.5" fill="#FFF7DA"/>
    <polygon points="0,0 -58,0 -14.5,10.5" fill="#A97D19"/>

    <!-- Diagonal Rays (36px) -->
    <polygon points="0,0 36,-36 18,-4.5" fill="#FFF9E3"/>
    <polygon points="0,0 36,-36 4.5,-18" fill="#855E10"/>
    <polygon points="0,0 -36,-36 -4.5,-18" fill="#F7E4B0"/>
    <polygon points="0,0 -36,-36 -18,-4.5" fill="#A67B18"/>
    <polygon points="0,0 36,36 4.5,18" fill="#F3DB99"/>
    <polygon points="0,0 36,36 18,4.5" fill="#946B14"/>
    <polygon points="0,0 -36,36 -18,4.5" fill="#FFF1C9"/>
    <polygon points="0,0 -36,36 -4.5,18" fill="#B2841D"/>

    <!-- Center Faceted Jewel -->
    <circle cx="0" cy="0" r="7" fill="#FFFDF4"/>
    <circle cx="0" cy="0" r="3.6" fill="#D4AF37"/>

    <!-- Flanking Sparkles -->
    <g transform="translate(-76, 0)">
      <path d="M 0 -13 L 3.4 -3.4 L 13 0 L 3.4 3.4 L 0 13 L -3.4 3.4 L -13 0 L -3.4 -3.4 Z" fill="#F9E8B7"/>
      <circle cx="0" cy="0" r="2" fill="#FFFDF6"/>
    </g>
    <g transform="translate(76, 0)">
      <path d="M 0 -13 L 3.4 -3.4 L 13 0 L 3.4 3.4 L 0 13 L -3.4 3.4 L -13 0 L -3.4 -3.4 Z" fill="#F9E8B7"/>
      <circle cx="0" cy="0" r="2" fill="#FFFDF6"/>
    </g>
  </g>

  <!-- ==========================================
       2. HERO WORDMARK: "GOD" (Sculpted Gold)
       ========================================== -->
  <g filter="url(#crestShadow)">
    <text x="261" y="274"
          font-family="'Cinzel', 'Georgia', 'Times New Roman', serif"
          font-size="112"
          font-weight="700"
          letter-spacing="10"
          fill="url(#textGold)"
          text-anchor="middle">GOD</text>
  </g>

  <!-- ==========================================
       3. DIVIDER: DIAMOND & TAPERED GOLD WINGS
       ========================================== -->
  <g transform="translate(256, 304)" filter="url(#starShadow)">
    <polygon points="0,-9 9,0 0,9 -9,0" fill="#FFF9E3"/>
    <circle cx="0" cy="0" r="3" fill="#C89F3C"/>
    <path d="M -18 0 L -40 -2.6 L -132 -0.8 L -148 0 L -132 0.8 L -40 2.6 Z" fill="url(#champagneGold)"/>
    <circle cx="-154" cy="0" r="2.8" fill="#FFF8DE"/>
    <path d="M 18 0 L 40 -2.6 L 132 -0.8 L 148 0 L 132 0.8 L 40 2.6 Z" fill="url(#champagneGold)"/>
    <circle cx="154" cy="0" r="2.8" fill="#FFF8DE"/>
  </g>

  <!-- ==========================================
       4. SUBTITLE: "MARKET" (Crisp Wide-Tracked)
       ========================================== -->
  <g filter="url(#starShadow)">
    <text x="262" y="349"
          font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif"
          font-size="29"
          font-weight="700"
          letter-spacing="13"
          fill="url(#champagneGold)"
          text-anchor="middle">MARKET</text>
  </g>

  <!-- ==========================================
       5. BOTANICAL LAUREL / COFFEE LEAVES WREATH
       ========================================== -->
  <g transform="translate(256, 396)" filter="url(#starShadow)">
    <circle cx="0" cy="6" r="4.8" fill="#FFF8DF"/>
    <circle cx="-8.5" cy="3" r="3.2" fill="#E3BE62"/>
    <circle cx="8.5" cy="3" r="3.2" fill="#E3BE62"/>

    <!-- Left Branch -->
    <path d="M -11 7 C -46 13 -88 4 -122 -17" fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26 8 C -31 2 -40 1 -46 7 C -42 13 -34 14 -26 8 Z" fill="#FBF0CB"/>
    <path d="M -52 7 C -59 -1 -69 -1 -75 6 C -71 13 -62 13 -52 7 Z" fill="#F1DA94"/>
    <path d="M -79 2 C -89 -7 -99 -5 -105 2 C -99 9 -90 9 -79 2 Z" fill="#DCB758"/>
    <path d="M -104 -6 C -114 -16 -124 -14 -129 -5 C -121 2 -112 2 -104 -6 Z" fill="#BD922E"/>
    <path d="M -123 -16 C -132 -27 -140 -22 -141 -14 C -134 -9 -127 -11 -123 -16 Z" fill="#9E761D"/>

    <!-- Right Branch -->
    <path d="M 11 7 C 46 13 88 4 122 -17" fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 26 8 C 31 2 40 1 46 7 C 42 13 34 14 26 8 Z" fill="#FBF0CB"/>
    <path d="M 52 7 C 59 -1 69 -1 75 6 C 71 13 62 13 52 7 Z" fill="#F1DA94"/>
    <path d="M 79 2 C 89 -7 99 -5 105 2 C 99 9 90 9 79 2 Z" fill="#DCB758"/>
    <path d="M 104 -6 C 114 -16 124 -14 129 -5 C 121 2 112 2 104 -6 Z" fill="#BD922E"/>
    <path d="M 123 -16 C 132 -27 140 -22 141 -14 C 134 -9 127 -11 123 -16 Z" fill="#9E761D"/>
  </g>
</svg>
