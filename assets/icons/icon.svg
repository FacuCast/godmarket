<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Velvety Botanical Pine Emerald Backdrop (warm studio lighting, never flat black) -->
    <linearGradient id="gmBg" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#204A39"/>
      <stop offset="46%" stop-color="#112A20"/>
      <stop offset="100%" stop-color="#081611"/>
    </linearGradient>

    <!-- Soft Emerald Center Illumination -->
    <radialGradient id="gmSpotlight" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#2E6751" stop-opacity="0.68"/>
      <stop offset="56%" stop-color="#143227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07120E" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Warm Champagne Aura behind Cup & Star -->
    <radialGradient id="gmGoldAura" cx="50%" cy="40%" r="38%">
      <stop offset="0%" stop-color="#EAD08E" stop-opacity="0.26"/>
      <stop offset="52%" stop-color="#C8A96A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C8A96A" stop-opacity="0"/>
    </radialGradient>

    <!-- Sculpted Satin Champagne Gold (cup body) -->
    <linearGradient id="gmGoldCup" x1="14%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#FFF7E2"/>
      <stop offset="26%" stop-color="#ECD092"/>
      <stop offset="64%" stop-color="#C9A65E"/>
      <stop offset="100%" stop-color="#967434"/>
    </linearGradient>

    <!-- Cup Rim Highlight -->
    <linearGradient id="gmRimGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF6DE"/>
      <stop offset="50%" stop-color="#E5C682"/>
      <stop offset="100%" stop-color="#B9944A"/>
    </linearGradient>

    <!-- Rich Dark Espresso Surface inside Rim -->
    <linearGradient id="gmEspresso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3C2F"/>
      <stop offset="55%" stop-color="#0D1F18"/>
      <stop offset="100%" stop-color="#07120E"/>
    </linearGradient>

    <!-- Specular Vertical Highlight for Ceramic/Gold Depth -->
    <linearGradient id="gmCupSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF6" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#FFFDF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFDF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Luminous Star & Aroma Gradient -->
    <linearGradient id="gmStarGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF4"/>
      <stop offset="45%" stop-color="#F2D99D"/>
      <stop offset="100%" stop-color="#C49E52"/>
    </linearGradient>

    <!-- Hairline Border Sheen -->
    <linearGradient id="gmFrameStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DFAC" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#C8A96A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E5C57E" stop-opacity="0.36"/>
    </linearGradient>

    <!-- Soft Tactile Emblem Shadow -->
    <filter id="gmShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#040D0A" flood-opacity="0.58"/>
    </filter>
  </defs>

  <!-- Full-bleed Rich Botanical Pine Background -->
  <rect width="512" height="512" fill="url(#gmBg)"/>
  <rect width="512" height="512" fill="url(#gmSpotlight)"/>
  <rect width="512" height="512" fill="url(#gmGoldAura)"/>

  <!-- Architectural Inner Champagne Frame -->
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="url(#gmFrameStroke)" stroke-width="2"/>

  <!-- Hero Emblem: Artisan Specialty Coffee Cup + Rising Celestial Star -->
  <g filter="url(#gmShadow)">
    <!-- Tapered Organic Aroma Wisps flanking the Celestial Star -->
    <path d="M 184 154 C 172 139 173 126 181 114 C 187 105 186 97 181 90 C 192 97 195 109 188 121 C 182 131 183 142 189 153 C 188 156 185 156 184 154 Z"
          fill="url(#gmStarGold)" opacity="0.78"/>
    <path d="M 306 154 C 318 139 317 126 309 114 C 303 105 304 97 309 90 C 298 97 295 109 302 121 C 308 131 307 142 301 153 C 302 156 305 156 306 154 Z"
          fill="url(#gmStarGold)" opacity="0.78"/>

    <!-- Signature GOD MARKET 4-Point Celestial Star Crest -->
    <path d="M 245 68 C 248.5 100 255 106.5 287 110 C 255 113.5 248.5 120 245 152 C 241.5 120 235 113.5 203 110 C 235 106.5 241.5 100 245 68 Z"
          fill="url(#gmStarGold)"/>
    <circle cx="245" cy="110" r="6.5" fill="#FFFDF8"/>

    <!-- Sculptural Cup Handle -->
    <path d="M 326 194 H 348 C 373 194 389 210 389 234 C 389 258 373 274 348 274 H 318"
          fill="none" stroke="url(#gmGoldCup)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cup Bowl Body (tapered boutique ceramic profile) -->
    <path d="M 157 179 H 333 V 225 C 333 277 295 312 245 312 C 195 312 157 277 157 225 Z"
          fill="url(#gmGoldCup)"/>

    <!-- Tactile Ceramic Gloss Highlight on Left Curve -->
    <path d="M 174 188 H 206 V 225 C 206 260 216 284 230 298 C 195 289 174 261 174 225 Z"
          fill="url(#gmCupSheen)"/>

    <!-- Sculpted Elliptical Rim & Deep Espresso Crema Top -->
    <ellipse cx="245" cy="179" rx="88" ry="15" fill="url(#gmRimGold)"/>
    <ellipse cx="245" cy="179" rx="76" ry="9.5" fill="url(#gmEspresso)"/>
    <!-- Delicate Crema Light Arc -->
    <path d="M 192 178 C 208 173 236 172 258 174" fill="none" stroke="#D9B672" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>

    <!-- Sleek Tapered Saucer Arc -->
    <path d="M 140 329 C 186 346 304 346 350 329 C 355 327 359 331 356 335 C 318 355 172 355 134 335 C 131 331 135 327 140 329 Z"
          fill="url(#gmGoldCup)"/>
  </g>

  <!-- Crisp Editorial Brand Wordmark -->
  <text x="262" y="414"
        font-family="'Cinzel', 'Georgia', 'Times New Roman', serif"
        font-size="66"
        font-weight="700"
        letter-spacing="11"
        fill="#F6EFE2"
        text-anchor="middle">GOD</text>

  <text x="261" y="449"
        font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif"
        font-size="19"
        font-weight="700"
        letter-spacing="10.5"
        fill="#D2B372"
        text-anchor="middle">MARKET</text>
</svg>
